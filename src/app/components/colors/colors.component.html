@if (items.length > 0 && items[0] !== '') {
  <mat-button-toggle-group
    [hideMultipleSelectionIndicator]="true"
    matRipple="off"
    [vertical]="vertical"
    multiple
    (change)="onChange($event)"
    [attr.vertical]="vertical?'1':null"
    >
    @for (color of items; track color) {
      <mat-button-toggle
        [value]="color"
        [checked]="selectedColors.includes(color)"
        >
        <span
          [ngStyle]="getStyle(color)"
          value
          >
          &nbsp;
        </span>
      </mat-button-toggle>
    }
  </mat-button-toggle-group>
}
